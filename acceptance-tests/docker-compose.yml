services:
  backend-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_acceptance
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_acceptance"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [backend-net]

  flights-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flights_acceptance
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flights_acceptance"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [flights-net]

  flights-service:
    build: ../flights-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: flights-postgres
      DB_PORT: 5432
      DB_NAME: flights_acceptance
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8081
      MANAGEMENT_TRACING_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
    ports:
      - "8081:8081"
    depends_on:
      flights-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [flights-net]

  backend:
    build: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: backend-postgres
      DB_PORT: 5432
      DB_NAME: backend_acceptance
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      FLIGHTS_SERVICE_URL: http://flights-service:8081
      CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:*,http://127.0.0.1:*
      MANAGEMENT_TRACING_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
    ports:
      - "8080:8080"
    depends_on:
      backend-postgres:
        condition: service_healthy
      flights-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [backend-net, flights-net]

  acceptance-tests:
    image: node:24-alpine
    working_dir: /tests
    environment:
      BACKEND_URL: http://backend:8080
      FLIGHTS_URL: http://flights-service:8081
    volumes:
      - .:/tests
    tmpfs:
      - /tests/node_modules
    depends_on:
      backend:
        condition: service_healthy
      flights-service:
        condition: service_healthy
    command: ["sh", "-c", "npm install --no-package-lock && npm test"]
    networks: [backend-net, flights-net]

networks:
  backend-net:
  flights-net:
