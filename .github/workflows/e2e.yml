name: Acceptance and E2E CI

on:
  workflow_call:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: acceptance-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exposes the cache service variables so Bake can use type=gha.
      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build images with cache and retry
        # From the repository root, so Bake can read the ../backend and ../flights-service contexts.
        working-directory: .
        run: scripts/ci-build-images.sh acceptance-tests/docker-compose.yml ctv-acceptance-ci

      - name: Start isolated application
        run: docker compose -p ctv-acceptance-ci up --no-build -d --wait --wait-timeout 180 backend

      - name: Run Cucumber
        run: docker compose -p ctv-acceptance-ci run --rm --no-deps acceptance-tests sh -c 'npm install --no-package-lock && npm test -- --profile ci'

      - name: Show application logs on failure
        if: failure()
        run: docker compose -p ctv-acceptance-ci logs --no-color --tail=200

      - name: Stop application
        if: always()
        run: docker compose -p ctv-acceptance-ci down

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exposes the cache service variables so Bake can use type=gha.
      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build images with cache and retry
        run: scripts/ci-build-images.sh docker-compose.e2e.yml ctv-e2e

      - name: Start application
        run: docker compose -f docker-compose.e2e.yml up --no-build -d --wait --wait-timeout 180

      - name: Run Cypress with Electron
        working-directory: frontend
        run: npm run e2e:run -- --browser electron

      - name: Show application logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color --tail=200

      - name: Stop application
        if: always()
        run: docker compose -f docker-compose.e2e.yml down
