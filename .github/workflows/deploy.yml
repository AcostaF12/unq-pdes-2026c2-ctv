name: Deploy Demo (Azure VM)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar"
        required: true
        type: choice
        options:
          - deploy
          - stop
        default: deploy

env:
  RESOURCE_GROUP: ctv-demo-rg
  VM_NAME: ctv-demo-vm

permissions:
  contents: read

concurrency:
  group: azure-demo
  cancel-in-progress: false

jobs:
  tests:
    if: inputs.action == 'deploy'
    uses: ./.github/workflows/e2e.yml

  publish:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, flights-service, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish tested commit
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          build-args: |
            VITE_API_BASE_URL=http://${{ secrets.VM_HOST }}:8080
          tags: ghcr.io/acostaf12/ctv-${{ matrix.service }}:${{ github.sha }}

  stop:
    if: inputs.action == 'stop'
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deallocate VM
        run: az vm deallocate --resource-group "$RESOURCE_GROUP" --name "$VM_NAME"

  deploy:
    needs: [tests, publish]
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start VM
        run: az vm start --resource-group "$RESOURCE_GROUP" --name "$VM_NAME"

      - name: Wait for SSH
        run: |
          for i in $(seq 1 30); do
            if nc -z -w5 "${{ secrets.VM_HOST }}" 22; then
              echo "SSH is up"
              exit 0
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 10
          done
          echo "Timed out waiting for SSH"
          exit 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -eu
            cd /opt/ctv
            release_compose() {
              docker compose -f docker-compose.yml -f docker-compose.prod.yml -f - "$@" <<'COMPOSE'
            services:
              backend:
                image: ghcr.io/acostaf12/ctv-backend:${{ github.sha }}
              flights-service:
                image: ghcr.io/acostaf12/ctv-flights-service:${{ github.sha }}
              frontend:
                image: ghcr.io/acostaf12/ctv-frontend:${{ github.sha }}
            COMPOSE
            }
            release_compose pull
            release_compose up -d --no-build

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf "http://${{ secrets.VM_HOST }}:8080/actuator/health" | grep -q '"status":"UP"'; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Waiting for backend health... ($i/20)"
            sleep 15
          done
          echo "Backend did not become healthy in time"
          exit 1
