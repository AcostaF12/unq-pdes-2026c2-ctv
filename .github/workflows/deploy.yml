name: Deploy Demo (Azure VM)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción a ejecutar"
        required: true
        type: choice
        options:
          - deploy
          - stop
        default: deploy

env:
  RESOURCE_GROUP: ctv-demo-rg
  VM_NAME: ctv-demo-vm

permissions:
  contents: read

concurrency:
  group: azure-demo
  cancel-in-progress: false

jobs:
  workflow-validation:
    if: inputs.action == 'deploy'
    uses: ./.github/workflows/workflow-validation.yml

  # Reusable workflows declare a publish job, so callers must allow its permissions.
  # checks-only skips that job; their build jobs use read-only tokens.
  backend:
    if: inputs.action == 'deploy'
    uses: ./.github/workflows/backend.yml
    permissions:
      contents: read
      packages: write
    with:
      checks-only: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  flights-service:
    if: inputs.action == 'deploy'
    uses: ./.github/workflows/flights-service.yml
    permissions:
      contents: read
      packages: write
    with:
      checks-only: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frontend:
    if: inputs.action == 'deploy'
    uses: ./.github/workflows/frontend.yml
    permissions:
      contents: read
      packages: write
    with:
      checks-only: true

  tests:
    if: inputs.action == 'deploy'
    uses: ./.github/workflows/e2e.yml

  preflight:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check deploy secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          fail() {
            echo "::error::$1 Create it with: openssl rand -base64 48 | gh secret set JWT_SECRET"
            exit 1
          }
          [ -n "${JWT_SECRET:-}" ] || fail "The JWT_SECRET repository secret is not configured."
          # jjwt requires at least 256 bits for HS256.
          [ "$(printf '%s' "$JWT_SECRET" | wc -c)" -ge 32 ] || fail "JWT_SECRET must be at least 32 bytes long."
          case "$JWT_SECRET" in
            *"'"*|*'"'*|*'$'*|*'`'*|*\\*|*' '*) fail "JWT_SECRET must not contain quotes, spaces, \$, backticks or backslashes." ;;
          esac
          echo "JWT_SECRET is configured."

  publish:
    needs: [backend, flights-service, frontend, preflight, tests, workflow-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, flights-service, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish tested commit
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          build-args: |
            VITE_API_BASE_URL=http://${{ secrets.VM_HOST }}:8080
          tags: ghcr.io/acostaf12/ctv-${{ matrix.service }}:${{ github.sha }}
          # Reuse the dependency layers cached by the CI image builds.
          cache-from: type=gha,scope=${{ matrix.service }}

  stop:
    if: inputs.action == 'stop'
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deallocate VM
        run: az vm deallocate --resource-group "$RESOURCE_GROUP" --name "$VM_NAME"

  deploy:
    needs: [tests, publish]
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start VM
        run: az vm start --resource-group "$RESOURCE_GROUP" --name "$VM_NAME"

      - name: Wait for SSH
        run: |
          for i in $(seq 1 30); do
            if nc -z -w5 "${{ secrets.VM_HOST }}" 22; then
              echo "SSH is up"
              exit 0
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 10
          done
          echo "Timed out waiting for SSH"
          exit 1

      # The secrets reach the VM as environment variables of the SSH session
      # (never inside the script text) and are stored in /opt/ctv/.env with mode 600.
      # The frontend (:8090) calls the API (:8080) cross-origin, so the backend must allow its origin.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VM_HOST: ${{ secrets.VM_HOST }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: JWT_SECRET,VM_HOST
          script: |
            set -eu
            : "${JWT_SECRET:?JWT_SECRET did not reach the VM}"
            : "${VM_HOST:?VM_HOST did not reach the VM}"
            case "$VM_HOST" in
              *[!A-Za-z0-9.-]*) echo "VM_HOST must be a plain host name or IPv4 address" >&2; exit 1 ;;
            esac
            cd /opt/ctv
            # Older releases left files owned by root; the deploy user must own the release files.
            if [ ! -w . ] || [ -n "$(find . ! -user "$(id -u)" -print -quit)" ]; then
              sudo -n chown -R "$(id -u):$(id -g)" /opt/ctv
            fi

            # Sync the Compose files and the monitoring config of the deployed commit.
            release=unq-pdes-2026c2-ctv-${{ github.sha }}
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            curl -fsSL --retry 3 "https://codeload.github.com/AcostaF12/unq-pdes-2026c2-ctv/tar.gz/${{ github.sha }}" > "$tmp/release.tar.gz"
            tar -xzf "$tmp/release.tar.gz" -C "$tmp" "$release/docker-compose.yml" "$release/docker-compose.prod.yml" "$release/monitoring"
            monitoring_changed=false
            diff -r "$tmp/$release/monitoring" monitoring > /dev/null 2>&1 || monitoring_changed=true
            mkdir -p monitoring
            # cp keeps the inodes of existing files, so single-file bind mounts see the new content.
            cp "$tmp/$release/docker-compose.yml" "$tmp/$release/docker-compose.prod.yml" .
            cp -R "$tmp/$release/monitoring/." monitoring/
            chmod -R a+rX docker-compose.yml docker-compose.prod.yml monitoring

            # Keep other settings of .env (seed, ...) and replace only the managed lines.
            touch .env
            (
              umask 077
              {
                grep -v -e '^JWT_SECRET=' -e '^CORS_ALLOWED_ORIGIN_PATTERNS=' .env || true
                printf "JWT_SECRET='%s'\n" "$JWT_SECRET"
                printf 'CORS_ALLOWED_ORIGIN_PATTERNS=http://%s:8090\n' "$VM_HOST"
              } > .env.new
            )
            chmod 600 .env.new
            mv .env.new .env

            release_compose() {
              docker compose -f docker-compose.yml -f docker-compose.prod.yml -f - "$@" <<'COMPOSE'
            services:
              backend:
                image: ghcr.io/acostaf12/ctv-backend:${{ github.sha }}
              flights-service:
                image: ghcr.io/acostaf12/ctv-flights-service:${{ github.sha }}
              frontend:
                image: ghcr.io/acostaf12/ctv-frontend:${{ github.sha }}
            COMPOSE
            }
            release_compose --profile monitoring pull
            release_compose --profile monitoring up -d --no-build --remove-orphans
            if [ "$monitoring_changed" = true ]; then
              # Prometheus, Grafana and Logstash only read their config at startup.
              release_compose --profile monitoring restart prometheus grafana logstash
            fi

      - name: Health check
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          healthy=false
          for i in $(seq 1 20); do
            if curl -sf "http://$VM_HOST:8080/actuator/health" | grep -q '"status":"UP"'; then
              echo "Backend healthy"
              healthy=true
              break
            fi
            echo "Waiting for backend health... ($i/20)"
            sleep 15
          done
          if [ "$healthy" != true ]; then
            echo "Backend did not become healthy in time"
            exit 1
          fi

          # Browsers only let the VM frontend log in if the API accepts its origin.
          origin="http://$VM_HOST:8090"
          if curl -s -o /dev/null -D - -X OPTIONS "http://$VM_HOST:8080/auth/login" \
              -H "Origin: $origin" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: content-type" \
              | tr -d '\r' | grep -qixF "access-control-allow-origin: $origin"; then
            echo "CORS allows $origin"
          else
            echo "::error::The backend rejects CORS requests from the VM frontend ($origin)"
            exit 1
          fi
