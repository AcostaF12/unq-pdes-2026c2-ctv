name: Backend CI

on:
  workflow_call:
    inputs:
      checks-only:
        description: "Run checks without publishing images"
        type: boolean
        default: true
    secrets:
      SONAR_TOKEN:
        required: false
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build

      - name: SonarCloud analysis and Quality Gate
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is required for internal CI and deploy checks. Configure the repository secret and pass it to reusable workflows."
            exit 1
          fi
          ./gradlew sonar -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300

      - name: Explain skipped Sonar analysis for fork PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::warning::Sonar analysis was skipped because fork PRs do not receive repository secrets. Build, tests and lint still run."

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && inputs.checks-only != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/acostaf12/ctv-backend:latest
            ghcr.io/acostaf12/ctv-backend:${{ github.sha }}
