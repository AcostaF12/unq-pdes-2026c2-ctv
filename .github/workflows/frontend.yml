name: Frontend CI

on:
  workflow_call:
    inputs:
      checks-only:
        description: "Run checks without publishing images"
        type: boolean
        default: true
    secrets:
      VM_HOST:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  push:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && inputs.checks-only != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ] || [ -z "${DOCKERHUB_NAMESPACE:-}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are required to publish images to Docker Hub (optional DOCKERHUB_NAMESPACE repository variable overrides the namespace)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=http://${{ secrets.VM_HOST }}:8080
          tags: |
            ghcr.io/acostaf12/ctv-frontend:latest
            ghcr.io/acostaf12/ctv-frontend:${{ github.sha }}

      # The Docker Hub image is built without VITE_API_BASE_URL so the app falls
      # back to http://localhost:8080 and works with docker-compose.hub.yml.
      - name: Build and push Docker Hub image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/ctv-frontend:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/ctv-frontend:${{ github.sha }}
