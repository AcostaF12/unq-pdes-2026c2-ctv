name: Flights Service CI

on:
  workflow_call:
    inputs:
      checks-only:
        description: "Run checks without publishing images"
        type: boolean
        default: true
    secrets:
      SONAR_TOKEN:
        required: false
  push:
    branches: [main, dev]
    paths:
      - "flights-service/**"
      - ".github/workflows/flights-service.yml"
      - "scripts/ci-gradle.sh"
  pull_request:
    branches: [main, dev]
    paths:
      - "flights-service/**"
      - ".github/workflows/flights-service.yml"
      - "scripts/ci-gradle.sh"

defaults:
  run:
    working-directory: flights-service

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # v5 runs on Node 24 and keeps the open-source cache; v6 moves caching to a proprietary component.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          # Caches ~/.gradle (dependencies and wrapper). main and dev save it, so new dependencies
          # are downloaded once and PRs reuse them instead of hitting Maven Central again.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and test
        # Retries only transient repository errors such as HTTP 429 from Maven Central.
        run: ../scripts/ci-gradle.sh build

      - name: SonarCloud analysis and Quality Gate
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is required for internal CI and deploy checks. Configure the repository secret and pass it to reusable workflows."
            exit 1
          fi
          # SonarCloud free: Quality Gate API only for main. Elsewhere analyze and rely on the SonarCloud GitHub check.
          WAIT=false
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            WAIT=true
          fi
          ./gradlew sonar -Dsonar.qualitygate.wait="${WAIT}" -Dsonar.qualitygate.timeout=300

      - name: Explain skipped Sonar analysis for fork PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::warning::Sonar analysis was skipped because fork PRs do not receive repository secrets. Build, tests and lint still run."

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && inputs.checks-only != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: flights-service
          push: true
          tags: |
            ghcr.io/acostaf12/ctv-flights-service:latest
            ghcr.io/acostaf12/ctv-flights-service:${{ github.sha }}
