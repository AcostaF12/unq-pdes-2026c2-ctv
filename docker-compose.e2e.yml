name: ctv-e2e

services:
  backend-postgres:
    extends:
      file: acceptance-tests/docker-compose.yml
      service: backend-postgres

  flights-postgres:
    extends:
      file: acceptance-tests/docker-compose.yml
      service: flights-postgres

  flights-service:
    extends:
      file: acceptance-tests/docker-compose.yml
      service: flights-service
    ports: !override
      - "127.0.0.1:18081:8081"

  backend:
    extends:
      file: acceptance-tests/docker-compose.yml
      service: backend
    ports: !override
      - "127.0.0.1:18080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:18080
    ports:
      - "127.0.0.1:18090:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend-net]

networks:
  backend-net:
  flights-net:
