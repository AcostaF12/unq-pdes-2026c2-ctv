# API de vuelos (Spring Boot): un Service interno + un Deployment con 1 réplica.
# Solo la usa el backend, así que su Service es ClusterIP: no se puede acceder desde afuera.
# Misma estructura que backend.yaml (initContainer, probes, seguridad); los comentarios largos
# sobre cada sección están ahí.

# Service: nombre estable (flights-service:8081) que usa FLIGHTS_SERVICE_URL en backend-config.
apiVersion: v1
kind: Service
metadata:
  name: flights-service
spec:
  # ClusterIP: IP virtual alcanzable solo dentro del cluster.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flights-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flights-service
spec:
  # Una réplica alcanza para la demo; se escala con `kubectl scale` sin tocar nada más.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flights-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flights-service
    spec:
      # Seguridad a nivel pod: no root, con el filtro de syscalls por defecto.
      securityContext:
        # El usuario app creado en la imagen (uid 10001).
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Cumple el papel de depends_on/service_healthy de Compose: arranca cuando la base responde.
        # -U evita buscar el uid 10001, que no tiene usuario en la imagen de postgres.
        - name: wait-for-db
          image: postgres:16.16
          command: ["sh", "-c", "until pg_isready -h flights-postgres -p 5432 -U ctv; do sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: flights-service
          # El tag lo fija kustomization.yaml (images).
          image: ghcr.io/acostaf12/ctv-flights-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          # Configuración común y propia desde ConfigMaps; la contraseña de la base, del Secret.
          envFrom:
            - configMapRef:
                name: ctv-common
            - configMapRef:
                name: flights-service-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: ctv-secrets, key: FLIGHTS_DB_PASSWORD }
          # startup: hasta 3 minutos para que arranque la JVM antes de que liveness pueda reiniciarla.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          # liveness: si el proceso se cuelga, se reinicia el contenedor.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # readiness: si la base no responde, el pod sale del Service hasta recuperarse.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
          # requests: reserva para el scheduler; limits: techo (memoria excedida = OOMKilled).
          resources:
            requests: { cpu: 100m, memory: 320Mi }
            limits: { cpu: "1", memory: 512Mi }
          # Sin escalar privilegios, sin capabilities y con el sistema de archivos de solo lectura.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Único lugar escribible: Tomcat y la JVM usan /tmp.
            - name: tmp
              mountPath: /tmp
            # La configuración de Logback del ConfigMap ctv-logback, como archivo.
            - name: logback
              mountPath: /etc/ctv
              readOnly: true
      volumes:
        # emptyDir: carpeta vacía que vive lo que vive el pod (no es persistente).
        - name: tmp
          emptyDir: {}
        - name: logback
          configMap:
            name: ctv-logback
