# DEMO VALUES ONLY: these credentials are public in the repository.
# For a real cluster, remove this file from kustomization.yaml and create the Secret with
# `kubectl create secret generic ctv-secrets ...` (see docs/kubernetes.md).
apiVersion: v1
kind: Secret
metadata:
  name: ctv-secrets
type: Opaque
stringData:
  BACKEND_DB_PASSWORD: demo-backend-db-password
  FLIGHTS_DB_PASSWORD: demo-flights-db-password
  # HS256 needs at least 32 bytes.
  JWT_SECRET: demo-only-jwt-secret-for-kubernetes-change-me-0123456789
