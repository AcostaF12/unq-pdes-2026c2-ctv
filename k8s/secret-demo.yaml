# Secret "ctv-secrets": contraseñas de las dos bases y la clave con la que el backend firma los JWT.
# A diferencia de un ConfigMap, un Secret se guarda aparte, se puede restringir con RBAC y no se
# muestra en `kubectl describe`. Ojo: en el YAML solo está codificado, no cifrado.
#
# SOLO PARA LA DEMO: estas credenciales son públicas porque están en el repositorio.
# En un cluster real, sacá este archivo de kustomization.yaml y creá el Secret con
# `kubectl create secret generic ctv-secrets ...` (ver docs/kubernetes.md).
apiVersion: v1
kind: Secret
metadata:
  name: ctv-secrets
# Opaque: pares clave/valor genéricos (no es un certificado TLS ni credenciales de registry).
type: Opaque
# stringData acepta texto plano; Kubernetes lo pasa a base64 (data) al guardarlo.
stringData:
  BACKEND_DB_PASSWORD: demo-backend-db-password
  FLIGHTS_DB_PASSWORD: demo-flights-db-password
  # HS256 necesita una clave de al menos 32 bytes.
  JWT_SECRET: demo-only-jwt-secret-for-kubernetes-change-me-0123456789
