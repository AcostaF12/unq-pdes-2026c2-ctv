# Application

spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Actuator

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Flights service (internal)

flights.service.url=${FLIGHTS_SERVICE_URL:http://localhost:8081}

# JWT

jwt.secret=${JWT_SECRET:dev-secret-change-me-please-32bytes-minimum-hs256-key!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Resilience4j

resilience4j.circuitbreaker.instances.flightsService.register-health-indicator=true
resilience4j.circuitbreaker.instances.flightsService.sliding-window-size=10
resilience4j.circuitbreaker.instances.flightsService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.flightsService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.flightsService.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.flightsService.max-attempts=3
resilience4j.retry.instances.flightsService.wait-duration=500ms

resilience4j.timelimiter.instances.flightsService.timeout-duration=3s
