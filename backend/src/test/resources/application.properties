management.tracing.export.enabled=false

spring.profiles.active=test

flights.service.url=http://localhost:8081

cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# Same as src/main: this file shadows the main application.properties on the test classpath.
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}

# Same histogram contract as src/main, plus the scrape endpoint the test reads.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.package_search_duration=true
