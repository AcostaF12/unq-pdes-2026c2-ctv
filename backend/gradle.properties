# Maven Central answers bursts of requests with HTTP 429. Gradle retries those requests with an
# exponential backoff before disabling the repository; give it more room than the defaults
# (3 tries, 1s initial backoff): 6 tries waiting 2s, 4s, 8s, 16s and 32s.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
