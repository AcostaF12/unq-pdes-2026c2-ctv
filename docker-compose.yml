services:
  backend-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_dev
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  flights-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flights_dev
    volumes:
      - flights_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flights_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flights-net

  flights-service:
    build: ./flights-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: flights-postgres
      DB_PORT: 5432
      DB_NAME: flights_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8081
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
    depends_on:
      flights-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - flights-net

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: backend-postgres
      DB_PORT: 5432
      DB_NAME: backend_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      FLIGHTS_SERVICE_URL: http://flights-service:8081
      CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:*,http://127.0.0.1:*
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
    ports:
      - "8080:8080"
    depends_on:
      backend-postgres:
        condition: service_healthy
      flights-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - backend-net
      - flights-net

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"
    networks:
      - backend-net
      - flights-net

  frontend:
    build: ./frontend
    ports:
      - "8090:80"
    depends_on:
      - backend
    networks:
      - frontend-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
      - flights-service
    networks:
      - backend-net
      - flights-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - logging-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5000:5000"
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend-net
      - flights-net
      - logging-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - logging-net

networks:
  backend-net:
  flights-net:
  frontend-net:
  logging-net:

volumes:
  backend_postgres_data:
  flights_postgres_data:
  grafana_data:
  elasticsearch_data:
