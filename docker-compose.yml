services:
  backend-postgres:
    image: postgres:16.16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_dev
    ports:
      - "${BACKEND_DB_PORT:-5433}:5432"
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  flights-postgres:
    image: postgres:16.16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flights_dev
    ports:
      - "${FLIGHTS_DB_PORT:-5434}:5432"
    volumes:
      - flights_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flights_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flights-net

  flights-service:
    build: ./flights-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: flights-postgres
      DB_PORT: 5432
      DB_NAME: flights_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8081
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: WARN
      LOGGING_LEVEL_ORG_HIBERNATE: WARN
    depends_on:
      flights-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - flights-net
      - tracing-net

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: backend-postgres
      DB_PORT: 5432
      DB_NAME: backend_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      FLIGHTS_SERVICE_URL: http://flights-service:8081
      CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:*,http://127.0.0.1:*
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Argentina/Buenos_Aires
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: WARN
      LOGGING_LEVEL_ORG_HIBERNATE: WARN
      SERVER_TOMCAT_ACCESSLOG_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      backend-postgres:
        condition: service_healthy
      flights-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - backend-net
      - flights-net
      - tracing-net

  zipkin:
    profiles: ["traces", "monitoring"]
    image: openzipkin/zipkin:3.6.1
    ports:
      - "9411:9411"
    networks:
      - tracing-net

  frontend:
    build: ./frontend
    ports:
      - "8090:8080"
    depends_on:
      - backend
    networks:
      - frontend-net

  prometheus:
    profiles: ["metrics", "monitoring"]
    image: prom/prometheus:v3.16.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
      - flights-service
    networks:
      - backend-net
      - flights-net

  grafana:
    profiles: ["metrics", "monitoring"]
    image: grafana/grafana:13.3.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_X_XSS_PROTECTION: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ctv-overview.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_DATAPROXY_LOGGING: "false"
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
      # Avisos de Grafana 13 sin efecto: el watcher de manifests vacío y los plugins core duplicados.
      GF_LOG_FILTERS: search-manifest-watcher:error,plugins.dedupe:error
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend-net

  elasticsearch:
    profiles: ["logs", "monitoring"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - logging-net

  logstash:
    profiles: ["logs", "monitoring"]
    image: docker.elastic.co/logstash/logstash:8.15.3
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5000:5000"
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend-net
      - flights-net
      - logging-net

  kibana:
    profiles: ["logs", "monitoring"]
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - logging-net

  # One-shot job: creates the ctv-logs-* data view in Kibana (idempotent).
  kibana-setup:
    profiles: ["logs", "monitoring"]
    image: curlimages/curl:8.17.0
    entrypoint: ["sh", "/setup/setup-data-view.sh"]
    volumes:
      - ./monitoring/kibana:/setup:ro
    depends_on:
      - kibana
    restart: "no"
    networks:
      - logging-net

networks:
  backend-net:
  flights-net:
  frontend-net:
  logging-net:
  tracing-net:

volumes:
  backend_postgres_data:
  flights_postgres_data:
  grafana_data:
  elasticsearch_data:
